<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autohaus Vatterott - Qualitätsmanagement</title>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-container">
                <div class="logo">
                    <h1>Autohaus Vatterott</h1>
                    <p>Qualitätsmanagement-System</p>
                </div>
                
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>

                <nav class="nav" id="mainNav">
                    <a href="/" class="nav-link active" data-page="dashboard">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="#vehicles" class="nav-link" data-page="vehicles">
                        <i class="fas fa-car"></i>
                        <span>Fahrzeuge</span>
                    </a>
                    <a href="#inspections" class="nav-link" data-page="inspections">
                        <i class="fas fa-clipboard-check"></i>
                        <span>Inspektionen</span>
                    </a>
                    <a href="#standards" class="nav-link" data-page="standards">
                        <i class="fas fa-star"></i>
                        <span>Standards</span>
                    </a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container" id="content">
                <!-- Content will be loaded here dynamically -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p>&copy; 2024 Autohaus Vatterott. Alle Rechte vorbehalten.</p>
                <p>
                    <a href="https://www.autohaus-vatterott.de" target="_blank" rel="noopener noreferrer">
                        www.autohaus-vatterott.de
                    </a>
                </p>
            </div>
        </footer>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
